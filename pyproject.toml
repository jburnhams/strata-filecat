[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-filecat"
version = "0.1.0"
description = "One catalogue and SHA-256 index for many file collections (SQLite, or the shared PostgreSQL on omarchy)"
readme = "README.md"
requires-python = ">=3.11"
# omarchy-db (SQLAlchemy, Alembic, psycopg) is in the private repo jburnhams/database (python/); it is not on PyPI, so
# install it from a checkout first: pip install -e ../database/python (strata-takeout's install.sh does).
dependencies = ["omarchy-db>=0.1"]

[project.scripts]
filecat = "filecat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filecat = ["migrations/*.py"]

[tool.omarchy-db]
app = "filecat"
models = "filecat.models:Base"
migrations = "src/filecat/migrations"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
line-length = 400            # long, dense lines on purpose, as in the other strata repos
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
