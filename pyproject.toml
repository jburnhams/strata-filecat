[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-filecat"
version = "0.1.0"
description = "One SQLite catalogue and SHA-256 index for many file collections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []                      # standard library only, on purpose

[project.scripts]
filecat = "filecat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
line-length = 400            # long, dense lines on purpose, as in the other strata repos
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
