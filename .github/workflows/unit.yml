name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lockfile, lint, format and types (once, on the newest Python)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run --no-sync strata-check --fast
      - name: Unit tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=term

  database:
    # migrations (dbtool check) and the same tests on a throwaway PostgreSQL 18 (as on omarchy), through the shared workflow in
    # jburnhams/database (it also runs them on SQLite)
    uses: jburnhams/database/.github/workflows/app-db.yml@main
    with:
      install: uv pip install -e . --group dev
      tests: tests/unit
