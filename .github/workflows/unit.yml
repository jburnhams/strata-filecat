name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-test.txt && pip install "omarchy-db @ git+https://github.com/jburnhams/database@main#subdirectory=python" && pip install -e .
      - run: ruff check src tests
      - run: pytest

  database:
    # migrations (dbtool check) and the same tests on a throwaway PostgreSQL 18 (as on omarchy), through the shared workflow in
    # jburnhams/database (it also runs them on SQLite)
    uses: jburnhams/database/.github/workflows/app-db.yml@main
    with:
      install: pip install -r requirements-test.txt && pip install -e .
      tests: tests/unit
